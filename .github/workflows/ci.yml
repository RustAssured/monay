name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        candidate: [A-saas, B-invest, C-savings, D-dataproduct, E-wildcard]
    defaults:
      run:
        working-directory: candidates/${{ matrix.candidate }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest numpy pandas scipy
      - run: python -m pytest -q
